name: Investigator bot poll

# Two-way Telegram bot on GitHub Actions.
#
# GitHub's `*/5 * * * *` cron on public repos is throttled to roughly ONE run
# per hour in practice, and a single short getUpdates covers a 1-second window
# per run - so a user command sent at any other moment would go unanswered.
#
# Two mitigations:
#  1. `poll_loop` inside bot.py stays open for ~9 minutes per invocation with
#     25-second LONG polls (server-side blocking), so any command that arrives
#     during those 9 minutes gets a sub-second reply.
#  2. `workflow_run` triggers this job right after the scan or refresh
#     completes, so a bot session opens minutes after every dataflow event.

on:
  schedule:
    # Every 30 min instead of every 10 min. GitHub honors `0,30 * * * *` far
    # more reliably than `*/10` on public repos, and combined with the 25-min
    # loop below the bot listens ~50 min out of every 60 (vs. ~15 min before)
    # while cutting the total workflow-run count by ~3x.
    - cron: "0,30 * * * *"
  workflow_dispatch:
  workflow_run:
    # Fires the bot right after every scan / refresh, so any command that
    # arrives during the data cycle gets a fresh listener within seconds.
    workflows: ["Investigator scan", "Investigator daily BQ refresh"]
    types: [completed]

permissions:
  contents: read

# If a new invocation fires (cron OR workflow_run) while a poll loop is still
# running, cancel the old one - the new one is fresher and simpler than
# stacking a backlog.
concurrency:
  group: investigator-bot-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # loop is 25 min; 30 min gives room for install + slack
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INVESTIGATOR_SITE_URL: ${{ vars.INVESTIGATOR_SITE_URL }}
      BOT_LOOP_SECONDS: "1500"       # 25 minutes of long polling per run
      BOT_LONG_POLL_SECONDS: "25"    # each getUpdates blocks up to 25s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PDF renderer system libraries (weasyprint)
        # needed by the /report command so we can build the PDF on demand
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libffi-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r investigator/requirements.txt

      - name: Poll and dispatch commands (long-poll loop)
        run: python -m investigator.bot
