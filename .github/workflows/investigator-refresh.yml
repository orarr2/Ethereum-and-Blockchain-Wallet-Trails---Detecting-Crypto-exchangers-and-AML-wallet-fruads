name: Investigator daily BQ refresh

# Runs the notebook end-to-end against live BigQuery once a day, refreshes
# suspicious_wallets_master.csv (and per-chain slices + report.html) and
# commits them back with [skip ci]. The 12:00 IL scan cron then reads the
# fresh master.
#
# COST GUARDRAILS
# ---------------
# 1. Hard cap in code: config.run_query aborts if the cumulative session
#    spend would exceed INVESTIGATOR_BQ_KILL_USD_DAILY (repo variable,
#    default 2.00 = $2/day).
# 2. Per-query BYTE cap: `maximum_bytes_billed` set to BQ_MAX_GB in every
#    query (default 200 GB).
# 3. Recommended EXTERNAL: a GCP-side Billing budget alert on the same
#    project (steps in investigator/SETUP_TELEGRAM.he.md).

on:
  # NO GitHub schedule - Cloud Scheduler is the sole authoritative trigger
  # (fires workflow_dispatch at 11:30 IL). A GitHub cron here would fire in
  # parallel and burn a second BigQuery scan per day.
  workflow_dispatch:
    inputs:
      kill_usd:
        description: "Override BQ daily cap (USD)"
        default: ""

permissions:
  contents: write        # commit the refreshed CSVs back to main
  id-token: write        # mint the GitHub OIDC token used by Workload Identity Federation

concurrency:
  group: investigator-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # notebook runs ~30-60 min; 90 min headroom
    env:
      BQ_PROJECT: ${{ vars.BQ_PROJECT }}
      BQ_MAX_GB: ${{ vars.BQ_MAX_GB || '200' }}
      INVESTIGATOR_BQ_KILL_USD_DAILY: ${{ github.event.inputs.kill_usd || vars.INVESTIGATOR_BQ_KILL_USD_DAILY || '2' }}
      LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '90' }}
      TRON_LOOKBACK_DAYS: ${{ vars.TRON_LOOKBACK_DAYS || '7' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify GCP config is set
        run: |
          if [ -z "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || \
             [ -z "${{ vars.GCP_SERVICE_ACCOUNT }}" ] || \
             [ -z "${{ vars.BQ_PROJECT }}" ]; then
            echo "::error::Missing GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, or BQ_PROJECT variable." >&2
            echo "Add them under Settings -> Secrets and variables -> Actions -> Variables." >&2
            exit 1
          fi

      - name: Authenticate to GCP via Workload Identity Federation
        # No JSON keys. GitHub mints a short-lived OIDC token; GCP exchanges it
        # for a temporary access token bound to the service account. The action
        # writes an ADC credential file and sets GOOGLE_APPLICATION_CREDENTIALS,
        # so config.make_bq_client() picks it up transparently.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill ipykernel

      - name: Execute notebook (kill-switch enforced by config.py)
        run: python -m investigator.refresh_notebook

      - name: Commit refreshed artifacts (skip if nothing changed)
        run: |
          git config user.email "actions@github.com"
          git config user.name "Investigator refresh"
          # Stage only the notebook outputs (skip the executed .ipynb dump)
          git add suspicious_wallets_master.csv \
                  suspicious_usdt_eth.csv suspicious_usdt_trc20.csv \
                  suspicious_btc.csv suspicious_zec.csv \
                  report.html \
                  data/ctf_leads.csv data/suspicious_wallets.csv \
                  data/suspicious_usdt_eth.csv data/suspicious_usdt_trc20.csv \
                  data/suspicious_btc.csv data/suspicious_zec.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to commit - master is unchanged since yesterday"
            exit 0
          fi
          MASTER_ROWS=$(wc -l < suspicious_wallets_master.csv)
          git commit -m "Daily BQ refresh $(date -u +%Y-%m-%d) - ${MASTER_ROWS} rows in master [skip ci]"
          git push
